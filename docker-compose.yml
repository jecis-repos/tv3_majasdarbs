services:
  mariadb:
    image: mariadb:11.4
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./wdump.sql:/docker-entrypoint-initdb.d/01-wordpress.sql:ro
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-root}
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-local-wordpress}
      MARIADB_DATABASE: bitnami_wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:6-php8.3-apache
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./bootstrap.php:/opt/exercise/bootstrap.php:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/wp-login.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:-local-wordpress}
      WORDPRESS_DB_NAME: bitnami_wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${HTTP_PORT:-8081}');
        define('WP_SITEURL', 'http://localhost:${HTTP_PORT:-8081}');
volumes:
  mariadb_data:
  wordpress_data:
